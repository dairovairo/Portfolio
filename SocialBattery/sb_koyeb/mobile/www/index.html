<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>SocialBattery</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0f;
        color: #f7f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
      }
      main {
        max-width: 320px;
        padding: 24px;
      }
      h1 { margin: 12px 0 4px; font-size: 22px; font-weight: 700; }
      p { margin: 4px 0 0; color: #b7b7c7; font-size: 14px; line-height: 1.5; }
      .bolt {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto;
        background: linear-gradient(135deg, #7c3aed, #22d3ee);
        display: grid;
        place-items: center;
        font-size: 34px;
        box-shadow: 0 20px 60px rgba(124,58,237,.35);
      }
      .spinner {
        margin: 20px auto 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #22d3ee;
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="bolt">⚡</div>
      <h1>SocialBattery</h1>
      <p>Cargando tu bateria social...</p>
      <div class="spinner" aria-hidden="true"></div>
    </main>
  </body>
</html>
